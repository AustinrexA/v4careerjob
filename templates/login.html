<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | V4Career</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .login-page {
            min-height: 100vh; display: grid; place-items: center;
            padding: 28px 16px;
            background: linear-gradient(135deg, #FFF9F3 0%, #FFFFFF 58%, #FFE8D8 100%);
        }
        .login-card {
            width: min(100%, 420px); background: #fff; border: 1px solid #EADFD5;
            border-radius: 16px; padding: 34px; box-shadow: 0 18px 55px rgba(82,54,32,.12);
        }
        .login-brand { display: flex; justify-content: center; margin-bottom: 26px; }
        .login-brand img { width: 175px; max-height: 100px; object-fit: contain; }
        .login-heading { margin: 0 0 8px; color: #263445; font-size: 26px; text-align: center; }
        .login-subtitle { margin: 0 0 26px; text-align: center; color: #786B60; line-height: 1.5; }
        .login-field { margin-bottom: 17px; }
        .login-field label { display: block; margin-bottom: 7px; color: #263445; font-weight: 600; }
        .login-field input {
            width: 100%; height: 45px; padding: 0 12px; border: 1px solid #cbd5e1;
            border-radius: 7px; background: #fff; color: #263445; outline: none;
        }
        .login-field input:focus { border-color: #FF6700; box-shadow: 0 0 0 3px rgba(255,103,0,.12); }
        .login-submit {
            width: 100%; height: 46px; border: 0; border-radius: 7px;
            background: linear-gradient(115deg, #FF6700, #F87920); color: #fff; font-weight: 700; cursor: pointer;
            margin-top: 6px;
        }
        .login-submit:hover { background: linear-gradient(115deg, #D95700, #E8660D); }
        .login-error {
            padding: 11px 12px; margin-bottom: 17px; border-radius: 7px;
            background: #fff0ef; border: 1px solid #f4c7c3; color: #a52820;
            font-size: 13px; line-height: 1.5;
        }
        .login-footer { text-align: center; margin: 22px 0 0; color: #786B60; font-size: 12px; }
        @media (max-width: 480px) { .login-card { padding: 26px 21px; } }
    </style>
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="loginHeading">
            <div class="login-brand">
                <img src="{{ url_for('static', filename='v4career_logo.png') }}" alt="V4Career">
            </div>
            <h1 class="login-heading" id="loginHeading">Welcome back</h1>
            <p class="login-subtitle">Sign in to access the V4Career Job Opportunities Portal.</p>
            {% if error %}
            <div class="login-error" role="alert">{{ error }}</div>
            {% endif %}
            <form method="post" action="{{ url_for('login') }}">
                <div class="login-field">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username"
                           placeholder="Enter your username" required autofocus>
                </div>
                <div class="login-field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" placeholder="Enter your password" required>
                </div>
                <button class="login-submit" type="submit">Sign in</button>
            </form>
            <p class="login-footer">V4Career · Job Opportunities Portal</p>
        </section>
    </main>
</body>
</html>
